name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main # Change this to your deployment branch if different

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_AADARSH_KUSHWAHA_PORTFOLIO || secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: aadarsh-kushwaha-portfolio
